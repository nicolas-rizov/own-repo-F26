<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student List</title>
</head>
<body>
    <h1>Student Names</h1>
    <ul>
        {% for name in names %}
            <li>{{ name }}</li>
        {% endfor %}
    </ul>

    <h1>Class Average Scores</h1>
    <ul>
        <li>Programming: {{ averages.programming }}</li>
        <li>Data / stats: {{ averages.data_stats }}</li>
        <li>Frontend design: {{ averages.frontend_design }}</li>
        <li>Business pitch: {{ averages.business_pitch }}</li>
    </ul>
</body>
</html>
